<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реєстрація</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    h1 { margin-bottom: 20px; font-size: 24px; }
    form { display: flex; flex-direction: column; gap: 15px; }
    input { 
      padding: 12px; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      font-size: 16px;
    }
    button {
      padding: 14px;
      background: var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, #fff);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
    .debug { 
      margin-top: 20px; 
      padding: 10px; 
      background: #f0f0f0; 
      border-radius: 5px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>📝 Реєстрація</h1>
  
  <div class="debug" id="debug">
    Завантаження...
  </div>
  
  <form id="regForm">
    <input type="hidden" name="tg_id" id="tg_id">
    
    <input 
      type="text" 
      name="name" 
      placeholder="Ім'я *" 
      required 
      minlength="2" 
      maxlength="50"
    >
    
    <input 
      type="email" 
      name="email" 
      placeholder="Email *" 
      required
    >
    
    <input 
      type="tel" 
      name="phone" 
      placeholder="Телефон (опціонально)" 
      pattern="\\+380[0-9]{9}"
    >
    
    <button type="submit">✅ Зареєструватись</button>
  </form>

  <script>
    const tg = window.Telegram?.WebApp;
    const debugEl = document.getElementById('debug');
    
    function log(msg) {
      console.log(msg);
      debugEl.innerHTML += msg + '<br>';
    }
    
    log('🔍 Telegram WebApp: ' + (tg ? 'ОК' : '❌ НЕ ЗНАЙДЕНО'));
    
    if (!tg) {
      debugEl.innerHTML = '❌ Відкрий в Telegram боті!';
      throw new Error('Telegram WebApp not available');
    }
    
    tg.ready();
    tg.expand();
    
    log('✅ WebApp ready');
    
    // Отримуємо tg_id
    const user = tg.initDataUnsafe?.user;
    const tgId = user?.id || new URLSearchParams(window.location.search).get('tg_id');
    
    log('👤 User ID: ' + (tgId || '❌ НЕ ЗНАЙДЕНО'));
    log('👤 First Name: ' + (user?.first_name || '—'));
    
    if (tgId) {
      document.getElementById('tg_id').value = tgId;
      log('✅ tg_id встановлено в форму');
    }
    
    // Обробка форми
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData);
      
      log('📤 Відправка: ' + JSON.stringify(data));
      
      try {
        const response = await fetch('/webhook/tilda/form', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        
        const result = await response.json();
        log('📥 Відповідь: ' + JSON.stringify(result));
        
        if (result.success) {
          tg.showAlert('✅ Реєстрація успішна!', () => {
            tg.close();
          });
        } else {
          tg.showAlert('❌ Помилка: ' + result.error);
        }
      } catch (err) {
        log('❌ Помилка: ' + err.message);
        tg.showAlert('❌ Помилка відправки');
      }
    });
  </script>
</body>
</html>
